name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing useful left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./bun install --frozen-lockfile
      - run: ./bun run check:filter-grammar
      - run: ./bun run check:sql
      - run: ./bun run typecheck
      - run: ./bun run lint
      - run: docker compose config --quiet

  docker-cli:
    name: Clean CLI image build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f docker/Dockerfile.cli .

  test:
    name: Unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest supported line; 24 is current LTS. Both must pass,
        # so we learn about version-specific breakage here rather than from a
        # user's install.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: ./bun install --frozen-lockfile
      # Same script as local runs, so CI can't diverge from what developers
      # verify against. The libraries' suites run on the Node in the matrix.
      - run: ./bun run test:unit

  test-db:
    name: Database integration tests
    runs-on: ubuntu-latest
    needs: check
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: ./bun install --frozen-lockfile
      # with-postgres.ts owns the container lifecycle, shared verbatim with the
      # local `check:full` run rather than duplicated as workflow shell.
      - run: ./bun scripts/with-postgres.ts ./bun run test:db

  # Source tests do not qualify the published artifact. Install the actual
  # tarball, typecheck it, provision/search/drop on Node and Bun, and run a
  # compiled consumer with its source/package files removed.
  artifact:
    name: Packaged install (node ${{ matrix.node }} + bun)
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: ./bun install --frozen-lockfile
      - run: ./bun scripts/with-postgres.ts ./bun run test:package

  # Branch protection requires only this stable aggregate context. Matrix legs
  # and implementation-specific jobs can change without silently weakening the
  # gate: this job succeeds only when every CI job above succeeded.
  ci:
    name: ci
    if: always()
    runs-on: ubuntu-latest
    needs: [check, docker-cli, test, test-db, artifact]
    steps:
      - name: Require every CI job to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          DOCKER_CLI_RESULT: ${{ needs['docker-cli'].result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_DB_RESULT: ${{ needs['test-db'].result }}
          ARTIFACT_RESULT: ${{ needs.artifact.result }}
        run: |
          set -euo pipefail
          for result in \
            "$CHECK_RESULT" \
            "$DOCKER_CLI_RESULT" \
            "$TEST_RESULT" \
            "$TEST_DB_RESULT" \
            "$ARTIFACT_RESULT"
          do
            if [ "$result" != success ]; then
              echo "A required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
